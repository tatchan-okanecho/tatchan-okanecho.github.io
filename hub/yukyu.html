<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>有給の日数｜制度とお金ラボ</title><meta name="description" content="勤続年数と週の勤務日数から、有給休暇の付与日数を計算。パート・アルバイトにも対応。">
<meta property="og:title" content="有給の日数｜制度とお金ラボ"><meta property="og:description" content="勤続年数と週の勤務日数から、有給休暇の付与日数を計算。パート・アルバイトにも対応。"><meta property="og:image" content="https://tatchan-okanecho.github.io/hub/img/og.png">
<meta name="theme-color" content="#fff7ea">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"></head><body><div class="app"><header class="top"><a class="back" href="tools.html" aria-label="戻る">‹</a><h1>有給の日数</h1></header><div class="pad">
<div class="tip"><img src="img/t_clap.png" alt=""><div class="b">有給は<b>パートやアルバイトにも</b>あります。時効は2年なので、残りの日数も見ておこう。</div></div>
<div class="card"><div class="field"><label>週に働く日数</label><div class="seg" id="seg"><button data-d="5" class="on">5日以上</button><button data-d="4">4日</button><button data-d="3">3日</button><button data-d="2">2日</button><button data-d="1">1日</button></div><small>週30時間以上なら「5日以上」と同じ扱い</small></div>
<div class="field"><label for="yy">勤続</label><div class="in"><input id="yy" type="number" inputmode="numeric" value="3"><span class="u">年</span><input id="mm" type="number" inputmode="numeric" value="6"><span class="u">か月</span></div></div></div>
<div class="res" id="out" aria-live="polite"></div>
<p class="small">労働基準法の最低日数です（出勤率8割以上が条件）。会社が上乗せしている場合はそちらが優先されます。年10日以上もらえる人は、年5日を取らせることが会社の義務です。</p></div><p class="foot">※2026年11月時点の公開情報をもとにした一般的な内容です。税額や制度の扱いは、所得・家族構成・会社の規定で異なります。最終判断は国税庁などの一次情報や勤務先の案内で確認してください。</p></div>
<script src="app.js"></script><script>tabbar("tool");</script><script>
var T={5:[10,11,12,14,16,18,20],4:[7,8,9,10,12,13,15],3:[5,6,6,8,9,10,11],2:[3,4,4,5,6,6,7],1:[1,2,2,2,3,3,3]},d=5;
function c(){var mo=(+document.getElementById('yy').value||0)*12+(+document.getElementById('mm').value||0);var out=document.getElementById('out');
if(mo<6){out.innerHTML='<div class="k">いまの付与日数</div><div class="v">まだ0日</div><div class="k">入社6か月で最初の有給がもらえます（あと'+(6-mo)+'か月）</div>';return;}
var i=Math.min(6,Math.floor((mo-6)/12)),days=T[d][i],nxt=i<6?(6+12*(i+1)-mo):null;
var rows=T[d].map(function(x,j){return '<tr><td>'+(j===0?'6か月':(j+0.5)+'年'+(j===6?'以上':''))+'</td><td'+(j===i?' style="color:#f7c544"':'')+'>'+x+'日</td></tr>'}).join('');
out.innerHTML='<div class="k">いま1年でもらえる日数</div><div class="v">'+days+'日</div>'+(nxt?'<div class="k">あと'+nxt+'か月で'+T[d][i+1]+'日にふえます</div>':'<div class="k">これ以上はふえません（上限）</div>')+'<table>'+rows+'</table>';}
document.querySelectorAll('#seg button').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('#seg button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');d=+b.dataset.d;c();})});
['yy','mm'].forEach(function(i){document.getElementById(i).addEventListener('input',c)});c();</script><script data-goatcounter="https://tatchan-lab.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></body></html>
