<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>残業代｜お給料の保健室</title><meta name="description" content="月給と残業時間から、残業代の目安を計算。60時間超・深夜・休日の割増つき。">
<meta property="og:title" content="残業代｜お給料の保健室"><meta property="og:description" content="月給と残業時間から、残業代の目安を計算。60時間超・深夜・休日の割増つき。"><meta property="og:image" content="https://tatchan-okanecho.github.io/hub/img/og.png">
<meta name="theme-color" content="#fff7ea">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"></head><body><div class="app"><header class="top"><a class="back" href="tools.html" aria-label="戻る" onclick="if(document.referrer&&document.referrer.indexOf(location.host)>=0&&history.length>1){history.back();return false}">‹</a><h1>残業代</h1></header><div class="pad">
<div class="tip"><img src="img/t_think.png" alt=""><div class="b">残業代は<b>「1時間あたりの給料×割増」</b>。60時間を超えた分と深夜は割増が上がります。</div></div>
<div class="card">
<div class="field"><label for="m">月給（残業代の計算に入る額）</label><div class="in"><input id="m" type="number" inputmode="decimal" value="30"><span class="u">万円</span></div><small>基本給＋多くの手当。通勤・家族・住宅手当などは入らないのが一般的</small></div>
<div class="field"><label for="h">1か月の所定労働時間（平均）</label><div class="in"><input id="h" type="number" inputmode="decimal" value="160"><span class="u">時間</span></div></div>
<div class="field"><label for="o">残業時間</label><div class="in"><input id="o" type="number" inputmode="decimal" value="20"><span class="u">時間</span></div></div>
<div class="field"><label for="n">そのうち22時〜5時</label><div class="in"><input id="n" type="number" inputmode="decimal" value="0"><span class="u">時間</span></div></div>
<div class="field"><label for="k">法定休日に働いた時間</label><div class="in"><input id="k" type="number" inputmode="decimal" value="0"><span class="u">時間</span></div></div></div>
<div class="res" id="out" aria-live="polite"></div>
<p class="small">法律の最低ラインでの計算です。会社の規定でこれより高い割増率のこともあります。管理監督者は残業代の対象外（深夜の割増は対象）です。</p></div><p class="foot">※2026年11月時点の公開情報をもとにした一般的な内容です。税額や制度の扱いは、所得・家族構成・会社の規定で異なります。最終判断は国税庁などの一次情報や勤務先の案内で確認してください。<br><a href="about.html" style="text-decoration:underline">運営者情報</a>・<a href="nenshu.html" style="text-decoration:underline">年収別の手取り一覧</a></p></div>
<script src="app.js"></script><script>tabbar("tool");</script><script>
function c(){var m=(+v('m'))*1e4,h=Math.max(1,+v('h')),o=Math.max(0,+v('o')),n=Math.min(Math.max(0,+v('n')),o),k=Math.max(0,+v('k'));var r=m/h;
var o1=Math.min(o,60),o2=Math.max(0,o-60),p1=r*1.25*o1,p2=r*1.5*o2,pn=r*.25*n,pk=r*1.35*k,t=p1+p2+pn+pk;
document.getElementById('out').innerHTML='<div class="k">残業代の目安（1か月）</div><div class="v">'+yen(t)+'</div><table><tr><td>1時間あたりの給料</td><td>'+yen(r)+'</td></tr><tr><td>残業60時間まで（×1.25）</td><td>'+yen(p1)+'</td></tr><tr><td>60時間超え（×1.5）</td><td>'+yen(p2)+'</td></tr><tr><td>深夜の上乗せ（×0.25）</td><td>'+yen(pn)+'</td></tr><tr><td>法定休日（×1.35）</td><td>'+yen(pk)+'</td></tr></table>';}
function v(i){return document.getElementById(i).value||0}
['m','h','o','n','k'].forEach(function(i){document.getElementById(i).addEventListener('input',c)});c();</script><script data-goatcounter="https://tatchan-lab.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></body></html>
