<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>退職金の税金｜お給料の保健室</title><meta name="description" content="退職金の手取りと税金を、金額と勤続年数から計算。退職所得控除と2分の1の計算つき。">
<meta property="og:title" content="退職金の税金｜お給料の保健室"><meta property="og:description" content="退職金の手取りと税金を、金額と勤続年数から計算。退職所得控除と2分の1の計算つき。"><meta property="og:image" content="https://tatchan-okanecho.github.io/hub/img/og.png">
<meta name="theme-color" content="#fff7ea">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"></head><body><div class="app"><header class="top"><a class="back" href="tools.html" aria-label="戻る" onclick="if(document.referrer&&document.referrer.indexOf(location.host)>=0&&history.length>1){history.back();return false}">‹</a><h1>退職金の税金</h1></header><div class="pad">
<div class="tip"><img src="img/t_point.png" alt=""><div class="b">退職金は給料よりずっと税金が軽い。<b>勤続30年なら1,500万円</b>まで税金ゼロです。</div></div>
<div class="card"><div class="field"><label for="a">退職金の額</label><div class="in"><input id="a" type="number" inputmode="decimal" value="2000"><span class="u">万円</span></div></div>
<div class="field"><label for="y">勤続年数</label><div class="in"><input id="y" type="number" inputmode="numeric" value="30"><span class="u">年</span></div><small>1年未満の端数は切り上げます</small></div></div>
<div class="res" id="out" aria-live="polite"></div>
<p class="small">会社に「退職所得の受給に関する申告書」を出した場合の一般的な計算です。勤続5年以下・役員・障害退職・同じ年に複数の退職金がある場合などは異なります。住民税は10%で計算。</p></div><p class="foot">※2026年11月時点の公開情報をもとにした一般的な内容です。税額や制度の扱いは、所得・家族構成・会社の規定で異なります。最終判断は国税庁などの一次情報や勤務先の案内で確認してください。</p></div>
<script src="app.js"></script><script>tabbar("tool");</script><script>
function itax(x){var t=[[1950000,.05,0],[3300000,.1,97500],[6950000,.2,427500],[9000000,.23,636000],[18000000,.33,1536000],[40000000,.4,2796000],[1/0,.45,4796000]];for(var i=0;i<t.length;i++)if(x<=t[i][0])return Math.max(0,x*t[i][1]-t[i][2]);}
function c(){var a=Math.max(0,+document.getElementById('a').value||0)*1e4,y=Math.max(1,Math.ceil(+document.getElementById('y').value||1));
var d=y<=20?Math.max(8e5,4e5*y):8e6+7e5*(y-20),tx=Math.floor(Math.max(0,a-d)/2/1000)*1000,it=Math.floor(itax(tx)*1.021),rt=Math.floor(tx*.1/100)*100;
document.getElementById('out').innerHTML=(a<=d?'<div class="k">税金</div><div class="v">0円</div><div class="k">非課税の枠の中です</div>':'<div class="k">手取りの目安</div><div class="v">'+yen(a-it-rt)+'</div>')+'<table><tr><td>非課税の枠（退職所得控除）</td><td>'+yen(d)+'</td></tr><tr><td>税金の対象（枠を超えた分の半分）</td><td>'+yen(tx)+'</td></tr><tr><td>所得税（復興税込み）</td><td>'+yen(it)+'</td></tr><tr><td>住民税</td><td>'+yen(rt)+'</td></tr><tr><td>税金の合計</td><td>'+yen(it+rt)+'</td></tr></table>'+(y<=5?'<p class="k" style="color:#ffd3c8">勤続5年以下は「半分にする」計算が使えないことがあります</p>':'');}
['a','y'].forEach(function(i){document.getElementById(i).addEventListener('input',c)});c();</script><script data-goatcounter="https://tatchan-lab.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></body></html>
